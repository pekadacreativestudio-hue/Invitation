<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>You're Invited — AR Betel Leaf Invitation</title>
<meta name="description" content="Hold up a betel leaf and see the invitation appear on it." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=10" />
</head>
<body>
  <video id="camera" playsinline autoplay muted></video>
  <canvas id="stage"></canvas>

  <div id="overlay">
    <div id="overlayBg" aria-hidden="true"></div>
    <h1 id="overlayHero"></h1>
    <p>
      Hold a real betel leaf on your palm and point the camera at it. The
      invitation will appear right on the leaf.
    </p>
    <button id="startBtn">Open Camera</button>
  </div>

  <div id="errorBox" hidden></div>
  <p id="hint" hidden>Show the betel leaf on your palm to the camera</p>

  <div id="controls">
    <button id="switchBtn" class="secondary">Switch Camera</button>
    <button id="snapBtn" class="secondary">Save Snapshot</button>
  </div>

  <button id="acceptBtn">Accept Invitation</button>

  <div id="eCard" hidden>
    <img id="eCardImage" alt="E-Invitation" hidden />
    <div id="eCardContent">
      <div id="eCardVinesLeft" aria-hidden="true"></div>
      <div id="eCardVinesRight" aria-hidden="true"></div>

      <div id="eCardHero"></div>
      <p id="eCardMessage"></p>

      <div class="eCardOrnament" aria-hidden="true">❧</div>

      <div id="eCardBand">
        <p id="eCardDate"></p>
        <p id="eCardVenue"></p>
        <div class="eCardSection">
          <h2>Dress Code:</h2>
          <p id="eCardDressCode"></p>
        </div>
      </div>

      <div class="eCardOrnament" aria-hidden="true">❧</div>

      <div class="eCardSection">
        <h2 id="eCardTimelineHeading">Time Line</h2>
        <ul id="eCardTimeline"></ul>
      </div>
    </div>
    <button id="backBtn" class="secondary">Back</button>
  </div>

  <script src="js/config.js?v=10"></script>
  <script src="js/leaf-detect.js?v=10"></script>
  <script src="js/sparkle-fx.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
