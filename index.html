<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>You're Invited — AR Betel Leaf Invitation</title>
<meta name="description" content="Hold up a betel leaf and see the invitation appear on it." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <video id="camera" playsinline autoplay muted></video>
  <canvas id="stage"></canvas>

  <div id="overlay">
    <h1>An Invitation Awaits</h1>
    <p>
      Enter your name, then hold a real betel leaf on your palm and point the
      camera at it. Your personal invitation will appear right on the leaf.
    </p>
    <input id="nameInput" type="text" placeholder="Your name" autocomplete="name" maxlength="40" />
    <button id="startBtn">Open Camera</button>
    <button id="testBtn" class="secondary">Preview without camera</button>
  </div>

  <div id="errorBox" hidden></div>
  <p id="hint" hidden>Show the betel leaf on your palm to the camera</p>

  <div id="controls">
    <button id="switchBtn" class="secondary">Switch Camera</button>
    <button id="snapBtn" class="secondary">Save Snapshot</button>
  </div>

  <button id="acceptBtn">Accept Invitation</button>

  <div id="eCard" hidden>
    <img id="eCardImage" alt="E-Invitation" hidden />
    <div id="eCardContent">
      <div id="eCardHero"></div>
      <p id="eCardGreeting"></p>
      <p id="eCardMessage"></p>
      <div class="eCardDivider"></div>
      <p id="eCardDate"></p>
      <p id="eCardVenue"></p>
      <div class="eCardSection">
        <h2>Dress Code</h2>
        <p id="eCardDressCode"></p>
      </div>
      <div class="eCardSection">
        <h2>Time Line</h2>
        <ul id="eCardTimeline"></ul>
      </div>
    </div>
    <button id="backBtn" class="secondary">Back</button>
  </div>

  <script src="js/config.js?v=5"></script>
  <script src="js/leaf-detect.js?v=5"></script>
  <script src="js/sparkle-fx.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
